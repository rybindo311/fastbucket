[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "fastbucket"
version = "0.1.0"
description = "Fast in-process token bucket rate limiter: C++ core with Python bindings"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Daniil Rybin", email = "rybindo311@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["rate-limiter", "token-bucket", "pybind11", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
]
dependencies = []

[tool.poetry]
package-mode = false

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
bench = ["pytest-benchmark>=4"]

[project.urls]
Homepage = "https://github.com/rybindo311/fastbucket"
Issues = "https://github.com/rybindo311/fastbucket/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/fastbucket"]
cmake.build-type = "Release"
editable.rebuild = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "scikit-build-core (>=0.10)",
    "pybind11 (>=2.13)",
    "pytest (>=8)",
    "hypothesis (>=6)",
    "httpx (>=0.27)",
    "fastapi (>=0.110)",
    "uvicorn[standard] (>=0.29)",
    "pytest-benchmark (>=4)",
    "cmake (>=3.15)",
    "ninja (>=1.13.2,<2.0.0)",
    "pybind11-stubgen (>=3.0.0,<4.0.0)"
]
